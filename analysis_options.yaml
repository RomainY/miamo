# Configuration de l'analyseur Dart / Flutter.
# Base : flutter_lints. Renforcée pendant l'audit (voir AUDIT_REPORT.md §2).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    # strict-inference / strict-raw-types : à activer dans un second temps
    # (nécessitent ~7 annotations de type explicites, lot B de l'audit).
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Robustesse
    - avoid_dynamic_calls
    - cast_nullable_to_non_nullable
    - no_leading_underscores_for_local_identifiers
    - unnecessary_null_checks
    - unawaited_futures
    - use_build_context_synchronously

    # Style / cohérence
    - prefer_relative_imports
    - directives_ordering
    - always_declare_return_types
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - prefer_single_quotes

    # Flutter
    - use_key_in_widget_constructors
    - sized_box_for_whitespace
