org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Contournement d'un bug connu du compilateur Kotlin incrémental sous
# Windows quand le projet et le cache pub (~/.pub-cache) sont sur des
# lecteurs différents (ici D: vs C:) : il plante en tentant de calculer un
# chemin relatif entre les deux racines. Désactiver l'incrémental évite le
# crash (léger surcoût de compilation, sans impact fonctionnel).
kotlin.incremental=false
